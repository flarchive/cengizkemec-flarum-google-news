      resources: Google kaynakları
      search_console: Google Search Console
      publisher_center: Google Publisher Center
      news_sitemap_docs: Haber site haritası belgeleri
      news_sitemap: Google Haberler site haritası
      content_sitemap: Genel içerik site haritası
      structured_data: Yapılandırılmış veri
