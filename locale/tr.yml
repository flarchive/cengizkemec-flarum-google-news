        is_news: Bu makaleyi haber makalesi olarak işaretle
        is_news_help: Haber makaleleri NewsArticle yapılandırılmış verisini kullanır ve Google Haberler site haritasında görünebilir.
        structured_data: Yapılandırılmış veriyi etkinleştir
        structured_data_help: Yalnızca başka bir eklenti bu makale için zaten yapılandırılmış veri sağlıyorsa kapatın.
        sitemap: Google Haberler site haritasına ekle
        sitemap_help: Yapılandırılan 48 saatlik aralıkta yayınlanmış bir haber makalesi gerektirir.
        feed: RSS ve Atom beslemelerine ekle
        feed_help: Yalnızca genel makaleler.
        headline: Özel haber başlığı
        headline_help: İsteğe bağlı. En fazla 200 karakter. Google 110 karaktere kadar önerir.
        description: Özel haber açıklaması
        description_help: Site haritalarında, beslemelerde ve üst verilerde kullanılan isteğe bağlı özet.
        category: Haber kategorisi
